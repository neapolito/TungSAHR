<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TungNet</title>
<style>
:root{--bg:#1c120b;--panel:#2a1b11;--line:#4a3220;--text:#f1e4d3;--muted:#b89c80;--accent:#d9a05b;--ink:#2a1706}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 50% -10%,#3a2415,var(--bg));color:var(--text);font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:clamp(3rem,10vw,5.5rem);margin:0 0 8px;letter-spacing:-.03em}h1 span{color:var(--accent)}
.tag{margin:0 0 32px;color:var(--muted)}
form{width:min(640px,100%);display:flex;gap:8px}
input{flex:1;min-width:0;padding:16px 20px;font:inherit;font-size:1.05rem;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #d9a05b33}
button{padding:0 26px;font:inherit;font-weight:700;color:var(--ink);background:var(--accent);border:0;border-radius:999px;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px;max-width:640px}
.quick a{color:var(--text);text-decoration:none;padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.quick a:hover,button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}
</style></head><body>
<h1>Tung<span>Net</span></h1>
<p class="tag">Search or enter a web address.</p>
<form action="/go" method="get"><input name="q" placeholder="Search the web or type a URL" aria-label="Search or URL" autofocus autocomplete="off"><button>Go</button></form>
<div class="quick">
<a href="/go?q=https://www.youtube.com">YouTube</a><a href="/go?q=https://www.tiktok.com">TikTok</a>
<a href="/go?q=https://html.duckduckgo.com/html/">DuckDuckGo</a><a href="/go?q=https://www.wikipedia.org">Wikipedia</a></div>
</body></html>
